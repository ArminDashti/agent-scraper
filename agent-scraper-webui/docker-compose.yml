name: agent-scraper
services:
  agent-scraper-webui:
    image: ${IMAGE_TAG:-agent-scraper-webui:latest}
    container_name: agent-scraper-webui
    environment:
      API_HOST: ${API_HOST:-agent-scraper-api}
      API_PORT: ${API_PORT:-8196}
    expose:
      - "${INTERNAL_PORT:-80}"
    ports:
      - target: ${INTERNAL_PORT:-80}
        published: ${PUBLISH_PORT:-5196}
        protocol: tcp
    networks:
      - agent-scraper-net
    restart: "no"

networks:
  agent-scraper-net:
    name: ${DOCKER_NETWORK:-agent-scraper-net}
    external: true